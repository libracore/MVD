<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Mandate zur Fallübernahme</title>
  <script>
        window.frappe = {};
        frappe.ready_events = [];
        frappe.ready = function(fn) {
            frappe.ready_events.push(fn);
        }
    </script>
    <link type="text/css" rel="stylesheet" href="/assets/css/frappe-web-b4.css">
</head>

<body>
    <script type="text/javascript" src="/assets/frappe/js/lib/jquery/jquery.min.js"></script>
    <script type="text/javascript" src="/assets/js/frappe-web.min.js"></script>
    <script type="text/javascript" src="/assets/js/bootstrap-4-web.min.js"></script>

    <main class="page">
        <section class="hero">
            <h1>Meine Mandate</h1>
            <p>
            Hier findest du eine Übersicht der dir zugeteilten Mandaten.
            </p>
        </section>
        <section class="filters">
            <select id="mandate-filter">
                <option value="open">Offene Mandate</option>
                <option value="closed">Geschlossene Mandate</option>
                <option value="all">Alle Mandate</option>
            </select>
        </section>
        <section class="layout">
            <aside class="list">
            {% for card_list in card_lists %}
                {{ card_list }}
            {% endfor %}
            </aside>

            <section class="detail platzhalter">
            <div class="detail-header">
                <div>
                <p class="detail-subtitle">
                    Bitte wählen sie ein Mandat zur Detailansicht.
                </p>
                </div>
            </div>
            </section>
            {% for detail_card in detail_cards %}
                {{ detail_card }}
            {% endfor %}
        </section>

        <div class="modal fade" id="fragen-dialog" tabindex="-1" role="dialog">
            <div class="modal-dialog" role="document">
                <div class="modal-content">

                    <div class="modal-header">
                        <h5 class="modal-title">Mandat abschliessen</h5>
                        <button type="button" class="close" data-dismiss="modal">
                            <span>&times;</span>
                        </button>
                    </div>

                    <div class="modal-body">
                        <div class="form-group">
                            <label>Frage 1</label>
                            <textarea class="form-control" id="frage-1" rows="3" required></textarea>
                        </div>

                        <div class="form-group">
                            <label>Frage 2</label>
                            <textarea class="form-control" id="frage-2" rows="3" required></textarea>
                        </div>

                        <div class="form-group">
                            <label>Frage 3</label>
                            <textarea class="form-control" id="frage-3" rows="3" required></textarea>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button
                            type="button"
                            class="btn btn-secondary"
                            data-dismiss="modal"
                        >
                            Abbrechen
                        </button>

                        <button
                            type="button"
                            class="btn btn-primary"
                            id="fragen-speichern"
                        >
                            Übernehmen
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </main>
    <!-- csrf_token -->
</body>
</html>
